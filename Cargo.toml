[workspace]
members = [
  "core/protocol",
  "core/storage",
  "core/notification-engine",
  "core/daemon",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/notracc1210/ai-monitor"
homepage = "https://github.com/notracc1210/ai-monitor"
authors = ["AI Monitor contributors"]

[workspace.dependencies]
ai-monitor-protocol = { path = "core/protocol" }
ai-monitor-storage = { path = "core/storage" }
ai-monitor-notification-engine = { path = "core/notification-engine" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
